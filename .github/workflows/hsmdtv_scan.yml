name: hsmdtv_scan
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: mkdir -p Hotel/HSMDTV/logs
      - name: Run IPTV update script
        env:
          WORK_DIR: ${{ github.workspace }}/Hotel/HSMDTV
          IP_LIST_FILE: ${{ github.workspace }}/Hotel/HSMDTV/ip/hsmd_ip.txt
          IP_OUTPUT_DIR: ${{ github.workspace }}/Hotel/HSMDTV/ip
          OUTPUT_M3U8: ${{ github.workspace }}/Hotel/HSMDTV/hsmd.m3u8
          OUTPUT_TXT: ${{ github.workspace }}/Hotel/HSMDTV/hsmd.txt
          LOG_FILE: ${{ github.workspace }}/Hotel/HSMDTV/logs/cron.log
          EPG_URL: ${{ secrets.EPG_URL || 'https://epg.112114.xyz/pp.xml' }}
          LOGO_BASE_URL: ${{ secrets.LOGO_BASE_URL || 'https://ghfast.top/...' }}
        run: python Hotel/HSMDTV/hsmdtv_scan.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          git add Hotel/HSMDTV/hsmd.m3u8 Hotel/HSMDTV/hsmd.txt \
              Hotel/HSMDTV/hsmd_by_isp.m3u8 Hotel/HSMDTV/scan_report.json \
              Hotel/HSMDTV/logs/cron.log Hotel/HSMDTV/ip/*.txt
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "Auto-update hsmdtv [$BEIJING_TIME]"
            git pull --rebase origin main
            git push
          }
